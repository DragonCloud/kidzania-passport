name: Supabase keepalive

# Supabase 免費專案一週沒有活動會自動暫停；每天呼叫一次 rpc keepalive() 保持活動。
# 注意：公開 repo 60 天沒有任何 commit，GitHub 會停用排程 workflow（會寄信通知），到 Actions 頁按啟用即可。
on:
  schedule:
    - cron: '17 1 * * *' # 每天 UTC 01:17（台北 09:17）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive()
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "未設定 VITE_SUPABASE_URL／VITE_SUPABASE_ANON_KEY，略過。"
            exit 0
          fi
          # Authorization 與 apikey 相同時，新版 publishable key 也接受（向下相容規則）
          curl -fsS --retry 3 --retry-delay 10 -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "keepalive OK"
